services:
  - type: web
    name: raktapraptih
    env: python
    region: oregon
    plan: free
    buildCommand: |
      pip install -r requirements.txt
    startCommand: |
      /bin/sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn --bind 0.0.0.0:$PORT RaktaPraptih.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: RaktaPraptih.settings
      - key: DATABASE_URL
        fromDatabase:
          name: raktapraptih-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ALLOWED_HOST
        value: raktapraptih.onrender.com

databases:
  - name: raktapraptih-db
    plan: free
    databaseName: raktapraptih
    user: raktapraptih