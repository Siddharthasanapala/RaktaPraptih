services:
  - type: web
    name: raktapraptih
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn RaktaPraptih.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DJANGO_SETTINGS_MODULE
        value: RaktaPraptih.settings
      - key: DATABASE_URL
        fromDatabase:
          name: raktapraptih-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0