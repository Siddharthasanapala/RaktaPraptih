name: CI/CD Pipeline

on:
  push:
    branches: [ siddhu, develop ]
  pull_request:
    branches: [ siddhu ]

permissions:
  actions: read
  contents: read
  security-events: write

env:
  PYTHON_VERSION: 3.11

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_raktapraptih
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage pytest-django bandit safety

    - name: Set up environment variables
      run: |
        echo "SECRET_KEY=test-secret-key-for-ci" >> $GITHUB_ENV
        echo "DEBUG=True" >> $GITHUB_ENV
        echo "DB_NAME=test_raktapraptih" >> $GITHUB_ENV
        echo "DB_USER=postgres" >> $GITHUB_ENV
        echo "DB_PASSWORD=postgres" >> $GITHUB_ENV
        echo "DB_HOST=localhost" >> $GITHUB_ENV
        echo "DB_PORT=5432" >> $GITHUB_ENV
        echo "DATABASE_URL=postgres://postgres:postgres@localhost:5432/test_raktapraptih?sslmode=disable" >> $GITHUB_ENV
        echo "CI=true" >> $GITHUB_ENV

    - name: Run security checks with Bandit
      run: |
        bandit -r . -x ./tests/,./venv/ -f json -o bandit-report.json || true
        bandit -r . -x ./tests/,./venv/

    - name: Check for security vulnerabilities
      env:
        SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
      run: |
        # Temporarily ignore vulnerability 66963 (djangorestframework-simplejwt CVE-2024-22513)
        # TODO: Revisit this after assessing the vulnerability impact or when a fix is available
        safety scan --ignore 66963

    - name: Run migrations
      run: |
        python manage.py migrate

    - name: Run tests with coverage
      run: |
        coverage run --source='.' manage.py test
        coverage xml
        coverage report

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
        verbose: true

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/siddhu' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      run: |
        docker build -t docker.io/${{ secrets.DOCKER_USERNAME }}/raktapraptih:${{ github.sha }} .
        docker push docker.io/${{ secrets.DOCKER_USERNAME }}/raktapraptih:${{ github.sha }}
        # Tag the image as latest for easier reference
        docker tag docker.io/${{ secrets.DOCKER_USERNAME }}/raktapraptih:${{ github.sha }} docker.io/${{ secrets.DOCKER_USERNAME }}/raktapraptih:latest
        docker push docker.io/${{ secrets.DOCKER_USERNAME }}/raktapraptih:latest

    - name: Test Docker image
      run: |
        # Create a Docker network for communication between containers
        docker network create test-network
        # Start PostgreSQL container
        docker run --rm -d --name test-postgres --network test-network -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=test_raktapraptih postgres:15
        # Wait for PostgreSQL to be ready
        for i in {1..30}; do
          if docker exec test-postgres pg_isready -U postgres; then
            break
          fi
          echo "Waiting for PostgreSQL to be ready... ($i/30)"
          sleep 1
        done
        # Run migrations inside the app container to set up the database
        docker run --rm --network test-network \
          -e SECRET_KEY=test-key \
          -e DEBUG=False \
          -e CI=true \
          -e DATABASE_URL=postgres://postgres:postgres@test-postgres:5432/test_raktapraptih?sslmode=disable \
          docker.io/${{ secrets.DOCKER_USERNAME }}/raktapraptih:${{ github.sha }} python manage.py migrate --noinput
        sleep 100
        # Start the application container
        docker run --rm -d --name test-container --network test-network \
          -e SECRET_KEY=test-key \
          -e DEBUG=False \
          -e CI=true \
          -e DATABASE_URL=postgres://postgres:postgres@test-postgres:5432/test_raktapraptih?sslmode=disable \
          -p 8000:8000 \
          docker.io/${{ secrets.DOCKER_USERNAME }}/raktapraptih:${{ github.sha }}
        sleep 10            
        echo "📍 In container - Starting application"
        exec gunicorn --bind 0.0.0.0:${PORT:-8000} --workers 4 --timeout 90 RaktaPraptih.wsgi:application
    
        # Clean up
        docker stop test-container test-postgres
        docker network rm test-network

    - name: Deploy to Render
      if: success()
      run: |
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
      env:
        RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    - name: Verify Render Deployment
      if: success()
      run: |
        # Replace with your Render app URL
        RENDER_APP_URL="https://raktapraptih-latest.onrender.com
        attempt=1
        max_attempts=20
        success=false
        while [ $attempt -le $max_attempts ]; do
          echo "Checking Render deployment availability... ($attempt/$max_attempts)"
          if curl -f "$RENDER_APP_URL"; then
            echo "Render deployment is ready!"
            success=true
            break
          else
            echo "Render deployment not yet available."
          fi
          sleep 5
          attempt=$((attempt + 1))
        done
        if [ "$success" != "true" ]; then
          echo "Render deployment failed to become available after $max_attempts attempts. Exiting..."
          exit 1
        fi

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@0.30.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'